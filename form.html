<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <link rel="stylesheet" href="style.css">

<body>
    <form action="">
        <label for="username">Username</label>
        <input type="text" id="username" class="username" placeholder="username" required/>
        <label for="password">Password</label>
        <input type="password" maxlength="8" id="password" class="password" placeholder="password" required/>
        <button type="submit">Login</button>

     <p>Enter your name
        <input type="text" name="your name" class="enter_name">
        </p>

     <p>Select gender
        <input type="radio" name="gender" value="female">female
        <input type="radio" name="gender" value="male">male
     </p>
     <p>Choose your study program
            <input type="checkbox" name="study program" value="BCS"> BCS 
            <input type="checkbox" name="study program" value="BSE"> BSE
            <input type="checkbox" name="study program" value="BBA"> BBA
            <input type="checkbox" name="study program" value="BCE"> BCE


        </p>
        <p>
        <select name="location">   
            <option value="select district"></option>
            <option value="kampala">Kampala</option>
            <option value="wakiso">Wakiso</option>
            <option value="entebbe">Entebbe</option>
         <option value="mukono">Mukono</option>

     </select>
     </p>
        <p>
         <input type="submit" value="Send data">
         <input type="reset" value="Delete data">
     </p>
    </form>
</body>
